# Runs the same three checks a local session runs before committing, so a green PR means the
# same thing as a clean working tree. Node 24 matches the version this project is developed on;
# `@types/node` is pinned to ^24 to match.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs `next typegen` first - Next 16 generates route types that app/layout.tsx depends on,
      # and they are not committed.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
